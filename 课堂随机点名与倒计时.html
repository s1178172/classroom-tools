<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>课堂随机点名 · 倒计时</title>
<style>
  :root {
    --bg-0: #0b1020;
    --bg-1: #131a33;
    --panel: rgba(255, 255, 255, 0.06);
    --panel-brd: rgba(255, 255, 255, 0.12);
    --txt: #eef2ff;
    --txt-dim: #9aa6cf;
    --accent: #6d8bff;
    --accent-2: #22d3a6;
    --warn: #ffb020;
    --danger: #ff5c7a;
    --shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    --radius: 22px;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB",
      "Helvetica Neue", Arial, system-ui, sans-serif;
    color: var(--txt);
    background:
      radial-gradient(1200px 800px at 12% -10%, #24306b 0%, transparent 55%),
      radial-gradient(1100px 700px at 100% 0%, #123a46 0%, transparent 50%),
      radial-gradient(900px 900px at 50% 120%, #2a1745 0%, transparent 55%),
      linear-gradient(160deg, var(--bg-0), var(--bg-1));
    background-attachment: fixed;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ---------- 顶栏 ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    padding: 22px clamp(16px, 3vw, 46px) 6px;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .logo {
    width: 46px;
    height: 46px;
    border-radius: 14px;
    display: grid;
    place-items: center;
    font-size: 24px;
    background: linear-gradient(140deg, var(--accent), var(--accent-2));
    box-shadow: 0 10px 26px rgba(109, 139, 255, 0.45);
  }

  .brand h1 {
    font-size: clamp(19px, 2.2vw, 27px);
    margin: 0;
    letter-spacing: 0.5px;
  }

  .brand p {
    margin: 2px 0 0;
    font-size: 13px;
    color: var(--txt-dim);
    letter-spacing: 0.5px;
  }

  .clock {
    font-variant-numeric: tabular-nums;
    font-size: clamp(14px, 1.6vw, 18px);
    color: var(--txt-dim);
    padding: 10px 18px;
    border: 1px solid var(--panel-brd);
    border-radius: 999px;
    background: var(--panel);
    backdrop-filter: blur(8px);
    white-space: nowrap;
  }

  /* ---------- 布局 ---------- */
  main {
    display: grid;
    grid-template-columns: 1.05fr 1fr;
    gap: clamp(14px, 2vw, 26px);
    padding: 14px clamp(16px, 3vw, 46px) 40px;
    align-items: start;
  }

  @media (max-width: 980px) {
    main { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--panel-brd);
    border-radius: var(--radius);
    padding: clamp(16px, 2.2vw, 28px);
    backdrop-filter: blur(14px);
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    opacity: 0.85;
  }

  .card h2 {
    margin: 0 0 4px;
    font-size: clamp(16px, 1.8vw, 20px);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .card h2 .tag {
    font-size: 11px;
    font-weight: 500;
    color: var(--txt-dim);
    border: 1px solid var(--panel-brd);
    border-radius: 999px;
    padding: 3px 9px;
  }

  .hint {
    color: var(--txt-dim);
    font-size: 13px;
    margin: 0 0 16px;
  }

  /* ---------- 点名区 ---------- */
  .name-stage {
    position: relative;
    border-radius: 18px;
    background:
      radial-gradient(600px 300px at 50% 0%, rgba(109, 139, 255, 0.22), transparent 70%),
      rgba(0, 0, 0, 0.22);
    border: 1px solid var(--panel-brd);
    height: clamp(180px, 26vh, 260px);
    display: grid;
    place-items: center;
    overflow: hidden;
    margin-bottom: 18px;
  }

  .name-stage::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 60%, rgba(0, 0, 0, 0.28));
    pointer-events: none;
  }

  #displayName {
    font-size: clamp(42px, 11vw, 108px);
    font-weight: 800;
    letter-spacing: 4px;
    line-height: 1.1;
    text-align: center;
    padding: 0 18px;
    background: linear-gradient(180deg, #ffffff, #c7d2ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    transition: transform 0.15s ease;
    will-change: transform, opacity;
    z-index: 1;
    word-break: break-all;
  }

  #displayName.idle {
    font-size: clamp(24px, 5vw, 40px);
    letter-spacing: 2px;
    background: none;
    -webkit-text-fill-color: var(--txt-dim);
    color: var(--txt-dim);
  }

  #displayName.rolling {
    animation: flick 0.09s linear infinite;
    filter: blur(0.4px);
  }

  @keyframes flick {
    0%   { transform: translateY(-6px) scale(0.97); opacity: 0.55; }
    50%  { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(6px) scale(0.97); opacity: 0.55; }
  }

  #displayName.win { animation: pop 0.5s cubic-bezier(0.2, 1.4, 0.4, 1); }

  @keyframes pop {
    0%   { transform: scale(0.6); opacity: 0; }
    60%  { transform: scale(1.12); opacity: 1; }
    100% { transform: scale(1); }
  }

  .stage-badge {
    position: absolute;
    top: 12px;
    left: 14px;
    font-size: 12px;
    color: var(--txt-dim);
    background: rgba(0, 0, 0, 0.32);
    border: 1px solid var(--panel-brd);
    padding: 5px 12px;
    border-radius: 999px;
    z-index: 2;
  }

  .btn-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    color: var(--txt);
    border-radius: 14px;
    font-size: clamp(15px, 1.6vw, 17px);
    font-weight: 600;
    padding: 14px 22px;
    transition: transform 0.12s ease, box-shadow 0.2s ease, opacity 0.2s ease,
      background 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }

  button:active { transform: translateY(2px) scale(0.99); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }

  .btn-primary {
    flex: 1 1 200px;
    background: linear-gradient(135deg, var(--accent), #8f6dff);
    box-shadow: 0 12px 30px rgba(109, 139, 255, 0.45);
  }
  .btn-primary:hover:not(:disabled) { transform: translateY(-2px); }

  .btn-green {
    background: linear-gradient(135deg, var(--accent-2), #16a97f);
    box-shadow: 0 12px 30px rgba(34, 211, 166, 0.35);
  }

  .btn-amber { background: linear-gradient(135deg, var(--warn), #ff8a3d); }
  .btn-red   { background: linear-gradient(135deg, var(--danger), #e0224f); }

  .btn-ghost {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--panel-brd);
  }
  .btn-ghost:hover:not(:disabled) { background: rgba(255, 255, 255, 0.16); }

  .btn-sm { padding: 10px 16px; font-size: 14px; border-radius: 12px; }

  /* ---------- 名单 ---------- */
  .list-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 22px 0 8px;
    font-size: 14px;
    color: var(--txt-dim);
  }

  .count-pill {
    background: rgba(109, 139, 255, 0.16);
    color: #c5d0ff;
    border: 1px solid rgba(109, 139, 255, 0.35);
    border-radius: 999px;
    padding: 4px 12px;
    font-variant-numeric: tabular-nums;
  }

  textarea {
    width: 100%;
    min-height: 130px;
    resize: vertical;
    border-radius: 16px;
    border: 1px solid var(--panel-brd);
    background: rgba(0, 0, 0, 0.28);
    color: var(--txt);
    font-family: inherit;
    font-size: 15px;
    line-height: 1.9;
    padding: 14px 16px;
    outline: none;
    transition: border 0.2s ease, box-shadow 0.2s ease;
  }

  textarea:focus {
    border-color: rgba(109, 139, 255, 0.7);
    box-shadow: 0 0 0 4px rgba(109, 139, 255, 0.16);
  }

  .switches {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    margin-top: 12px;
    color: var(--txt-dim);
    font-size: 14px;
  }

  .switch {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    cursor: pointer;
    user-select: none;
  }

  input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 42px;
    height: 24px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.16);
    position: relative;
    transition: background 0.2s ease;
    cursor: pointer;
    flex: none;
    margin: 0;
  }
  input[type="checkbox"]::after {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #fff;
    transition: transform 0.2s ease;
  }
  input[type="checkbox"]:checked {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
  }
  input[type="checkbox"]:checked::after { transform: translateX(18px); }

  /* ---------- 倒计时 ---------- */
  .timer-stage {
    position: relative;
    display: grid;
    place-items: center;
    margin: 8px 0 18px;
  }

  .timer-stage svg { transform: rotate(-90deg); }
  .ring-bg { stroke: rgba(255, 255, 255, 0.09); }
  .ring-fg {
    stroke: url(#ringGrad);
    stroke-linecap: round;
    transition: stroke-dashoffset 0.35s linear, stroke 0.3s ease;
  }

  .timer-readout {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    text-align: center;
  }

  #timeText {
    font-size: clamp(38px, 8.5vw, 76px);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: 2px;
    line-height: 1;
  }

  .timer-stage.finished #timeText { animation: blink 0.9s ease-in-out infinite; }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }

  .presets {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .presets .btn-sm { padding: 9px 15px; }

  .setter {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    color: var(--txt-dim);
    font-size: 14px;
  }

  .num-input {
    width: 84px;
    padding: 11px 12px;
    border-radius: 12px;
    border: 1px solid var(--panel-brd);
    background: rgba(0, 0, 0, 0.28);
    color: var(--txt);
    font-family: inherit;
    font-size: 16px;
    text-align: center;
    font-variant-numeric: tabular-nums;
    outline: none;
  }
  .num-input:focus {
    border-color: rgba(34, 211, 166, 0.7);
    box-shadow: 0 0 0 4px rgba(34, 211, 166, 0.16);
  }

  .timer-stats {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 14px;
    color: var(--txt-dim);
    font-size: 13px;
  }
  .timer-stats span {
    background: rgba(0, 0, 0, 0.24);
    border: 1px solid var(--panel-brd);
    border-radius: 10px;
    padding: 7px 12px;
  }
  .timer-stats b { color: var(--txt); font-weight: 700; }

  /* ---------- 历史 ---------- */
  .history-wrap {
    margin-top: 18px;
    border-top: 1px dashed var(--panel-brd);
    padding-top: 14px;
  }
  .history-wrap .list-head { margin: 0 0 10px; }
  #history {
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
    min-height: 30px;
  }
  #history .chip {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--panel-brd);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 14px;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }

  .empty-note { color: rgba(154, 166, 207, 0.6); font-size: 13px; }

  /* ---------- 全屏揭晓 ---------- */
  #overlay {
    position: fixed;
    inset: 0;
    display: none;
    place-items: center;
    background: radial-gradient(900px 700px at 50% 40%, rgba(52, 66, 140, 0.6), rgba(4, 6, 16, 0.92));
    backdrop-filter: blur(6px);
    z-index: 50;
    cursor: pointer;
  }
  #overlay.show { display: grid; animation: fadeIn 0.25s ease; }
  #overlayName {
    font-size: clamp(70px, 17vw, 220px);
    font-weight: 900;
    letter-spacing: 8px;
    background: linear-gradient(180deg, #ffffff, #9fb2ff 70%, #5c7bff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 90px rgba(120, 150, 255, 0.55);
    animation: pop 0.55s cubic-bezier(0.2, 1.5, 0.4, 1);
    text-align: center;
    word-break: break-all;
    padding: 0 24px;
  }
  #overlay .ov-tip {
    position: absolute;
    bottom: 40px;
    color: var(--txt-dim);
    font-size: 14px;
    letter-spacing: 2px;
  }

  /* ---------- 彩带 ---------- */
  #confetti {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 60;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 34px;
    transform: translateX(-50%) translateY(20px);
    background: rgba(20, 26, 50, 0.95);
    border: 1px solid var(--panel-brd);
    color: var(--txt);
    padding: 12px 22px;
    border-radius: 14px;
    font-size: 14px;
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 70;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.16);
    border-radius: 999px;
  }
  ::-webkit-scrollbar-track { background: transparent; }

  footer {
    text-align: center;
    color: rgba(154, 166, 207, 0.55);
    font-size: 12.5px;
    padding: 0 20px 30px;
    letter-spacing: 0.6px;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">🎓</div>
    <div>
      <h1>课堂随机点名 · 倒计时</h1>
      <p>Random Caller &amp; Countdown — 投影友好 · 单文件网页</p>
    </div>
  </div>
  <div class="clock" id="realClock">--:--:--</div>
</header>

<main>
  <section class="card">
    <h2>🎲 随机点名 <span class="tag">空格键抽取</span></h2>
    <p class="hint">输入学生名单（每行一个，也可用逗号、顿号、空格分隔），点击按钮随机抽取。</p>

    <div class="name-stage">
      <div class="stage-badge" id="poolBadge">名单为空</div>
      <div id="displayName" class="idle">准备就绪</div>
    </div>

    <div class="btn-row">
      <button class="btn-primary" id="drawBtn">🎯 开始抽人</button>
      <button class="btn-ghost" id="fullBtn">全屏揭晓</button>
    </div>

    <div class="switches">
      <label class="switch">
        <input type="checkbox" id="noRepeat" checked />
        不重复抽取
      </label>
      <label class="switch">
        <input type="checkbox" id="confettiOn" checked />
        中奖彩带
      </label>
      <label class="switch">
        <input type="checkbox" id="soundOn" checked />
        提示音
      </label>
    </div>

    <div class="list-head">
      <span>学生名单</span>
      <span class="count-pill" id="countPill">0 人</span>
    </div>
    <textarea id="nameInput" spellcheck="false" placeholder="张三&#10;李四&#10;王五&#10;赵六&#10;……（每行一个）"></textarea>

    <div class="btn-row" style="margin-top:12px">
      <button class="btn-ghost btn-sm" id="sampleBtn">载入示例名单</button>
      <button class="btn-ghost btn-sm" id="clearBtn">清空名单</button>
      <button class="btn-ghost btn-sm" id="resetPoolBtn">重置抽取进度</button>
    </div>

    <div class="history-wrap">
      <div class="list-head">
        <span>已抽到</span>
        <span class="empty-note" id="poolInfo">剩余 0 / 0</span>
      </div>
      <div id="history">
        <span class="empty-note">还没有抽取记录</span>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>⏱️ 倒计时器 <span class="tag">回车键 开始/暂停</span></h2>
    <p class="hint">为课堂提问、分组练习、随堂测试设定时间。</p>

    <div class="presets">
      <button class="btn-ghost btn-sm" data-sec="30">30 秒</button>
      <button class="btn-ghost btn-sm" data-sec="60">1 分钟</button>
      <button class="btn-ghost btn-sm" data-sec="120">2 分钟</button>
      <button class="btn-ghost btn-sm" data-sec="180">3 分钟</button>
      <button class="btn-ghost btn-sm" data-sec="300">5 分钟</button>
      <button class="btn-ghost btn-sm" data-sec="600">10 分钟</button>
    </div>

    <div class="setter">
      自定义：
      <input class="num-input" id="minInput" type="number" min="0" max="180" value="1" />
      分
      <input class="num-input" id="secInput" type="number" min="0" max="59" value="0" />
      秒
      <button class="btn-ghost btn-sm" id="applyBtn">设定</button>
    </div>

    <div class="timer-stage" id="timerStage">
      <svg width="300" height="300" viewBox="0 0 300 300">
        <defs>
          <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#22d3a6" />
            <stop offset="100%" stop-color="#6d8bff" />
          </linearGradient>
        </defs>
        <circle class="ring-bg" cx="150" cy="150" r="132" fill="none" stroke-width="16" />
        <circle class="ring-fg" id="ringFg" cx="150" cy="150" r="132" fill="none" stroke-width="16"
                stroke-dasharray="829.38" stroke-dashoffset="0" />
      </svg>
      <div class="timer-readout">
        <div id="timeText">01:00</div>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn-green" id="startPauseBtn" style="flex:1 1 150px">▶ 开始</button>
      <button class="btn-amber" id="resetTimerBtn">↺ 重置</button>
      <button class="btn-ghost" id="soundToggle2">🔔 铃声：开</button>
    </div>

    <div class="timer-stats">
      <span>状态：<b id="timerState">待机</b></span>
      <span>已完成轮次：<b id="roundCount">0</b></span>
      <span>累计计时：<b id="totalTime">00:00</b></span>
    </div>
  </section>
</main>

<footer>快捷键：空格抽取 · 回车 开始/暂停 · Esc 关闭全屏 · 名单自动保存在本机浏览器</footer>

<div id="overlay"><div id="overlayName"></div><div class="ov-tip">点击任意位置关闭</div></div>
<canvas id="confetti"></canvas>
<div class="toast" id="toast"></div>

<script>
/* ===================== 通用工具 ===================== */
const $ = (id) => document.getElementById(id);

let toastTimer = null;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* 轻量提示音（Web Audio 合成，无需外部音频文件） */
let audioCtx = null;
function beep(freq, dur, type, gain) {
  freq = freq || 880; dur = dur || 0.12; type = type || "sine"; gain = gain || 0.16;
  if (!$("soundOn").checked) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(gain, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + dur);
  } catch (e) { /* 忽略音频权限问题 */ }
}

/* ===================== 实时时钟 ===================== */
function tickClock() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  const wk = "日一二三四五六"[d.getDay()];
  $("realClock").textContent =
    d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) +
    " 周" + wk + " " + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}
setInterval(tickClock, 1000);
tickClock();

/* ===================== 名单管理 ===================== */
const LS_NAMES = "classroom.names.v1";
let allNames = [];    // 全量名单（已去空）
let drawnNames = [];  // 已抽取记录
let rolling = false;

function parseNames(text) {
  return text
    .split(/[\n,，、;；\t]+/)
    .map((s) => s.trim())
    .filter(Boolean);
}

function syncNames(keepProgress) {
  allNames = parseNames($("nameInput").value);
  if (!keepProgress) drawnNames = drawnNames.filter((n) => allNames.indexOf(n) > -1);
  $("countPill").textContent = allNames.length + " 人";
  try { localStorage.setItem(LS_NAMES, $("nameInput").value); } catch (e) {}
  renderPoolInfo();
  updateDrawButton();
}

function remainingPool() {
  if (!$("noRepeat").checked) return allNames.slice();
  return allNames.filter((n) => drawnNames.indexOf(n) === -1);
}

function renderPoolInfo() {
  const remain = remainingPool().length;
  $("poolBadge").textContent = allNames.length
    ? "名单 " + allNames.length + " 人 · 可抽 " + remain + " 人"
    : "名单为空";
  $("poolInfo").textContent = "剩余 " + remain + " / " + allNames.length;
}

function updateDrawButton() {
  const btn = $("drawBtn");
  if (!allNames.length) {
    btn.textContent = "🎯 请先输入名单";
    btn.disabled = true;
  } else if ($("noRepeat").checked && remainingPool().length === 0) {
    btn.textContent = "✅ 已全部抽完";
    btn.disabled = true;
  } else {
    btn.textContent = rolling ? "抽取中…" : "🎯 开始抽人";
    btn.disabled = rolling;
  }
}

function renderHistory() {
  const box = $("history");
  if (!drawnNames.length) {
    box.innerHTML = '<span class="empty-note">还没有抽取记录</span>';
    return;
  }
  box.innerHTML = drawnNames
    .map((n) => '<span class="chip">' + escapeHtml(n) + "</span>")
    .join("");
}

/* ===================== 抽取动画 ===================== */
function draw() {
  if (rolling) return;
  if (!allNames.length) { toast("请先输入学生名单"); return; }
  const pool = remainingPool();
  if (!pool.length) { toast("已全部抽完，可点击「重置抽取进度」"); return; }

  rolling = true;
  updateDrawButton();
  $("fullBtn").disabled = true;

  const el = $("displayName");
  el.classList.remove("idle", "win");
  el.classList.add("rolling");

  const totalTicks = 26 + Math.floor(Math.random() * 10);
  const finalName = pool[Math.floor(Math.random() * pool.length)];
  let i = 0;

  const timer = setInterval(() => {
    i++;
    el.textContent = pool[Math.floor(Math.random() * pool.length)];
    beep(420 + Math.random() * 500, 0.03, "square", 0.05);
    if (i >= totalTicks) {
      clearInterval(timer);
      finishDraw(finalName);
    }
  }, 60);
}

function finishDraw(name) {
  const el = $("displayName");
  el.classList.remove("rolling");
  el.textContent = name;
  el.classList.add("win");

  drawnNames.push(name);
  renderHistory();
  renderPoolInfo();

  beep(880, 0.14, "sine", 0.2);
  setTimeout(() => beep(1320, 0.18, "sine", 0.18), 110);
  if ($("confettiOn").checked) burstConfetti();

  rolling = false;
  $("fullBtn").disabled = false;
  updateDrawButton();
}

/* 全屏揭晓 */
$("fullBtn").addEventListener("click", () => {
  const el = $("displayName");
  const name = el.classList.contains("idle") ? "" : el.textContent;
  if (!name) { toast("先抽取一位同学再全屏揭晓"); return; }
  $("overlayName").textContent = name;
  $("overlay").classList.add("show");
});
$("overlay").addEventListener("click", () => $("overlay").classList.remove("show"));

/* ===================== 彩带 ===================== */
const cvs = $("confetti");
const ctx = cvs.getContext("2d");
let confettiPieces = [];
let confettiRAF = null;

function sizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  cvs.width = window.innerWidth * dpr;
  cvs.height = window.innerHeight * dpr;
  cvs.style.width = window.innerWidth + "px";
  cvs.style.height = window.innerHeight + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
sizeCanvas();
window.addEventListener("resize", sizeCanvas);

function burstConfetti() {
  const colors = ["#6d8bff", "#22d3a6", "#ffb020", "#ff5c7a", "#8f6dff", "#ffffff"];
  const W = window.innerWidth, H = window.innerHeight;
  for (let i = 0; i < 140; i++) {
    confettiPieces.push({
      x: W / 2 + (Math.random() - 0.5) * W * 0.5,
      y: H * 0.35 + (Math.random() - 0.5) * 60,
      vx: (Math.random() - 0.5) * 14,
      vy: Math.random() * -16 - 4,
      g: 0.4 + Math.random() * 0.25,
      size: 6 + Math.random() * 8,
      color: colors[(Math.random() * colors.length) | 0],
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.3,
      life: 90 + Math.random() * 50
    });
  }
  if (!confettiRAF) confettiRAF = requestAnimationFrame(stepConfetti);
}

function stepConfetti() {
  ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  confettiPieces = confettiPieces.filter((p) => p.life > 0 && p.y < window.innerHeight + 60);
  confettiPieces.forEach((p) => {
    p.vy += p.g;
    p.x += p.vx;
    p.y += p.vy;
    p.rot += p.vr;
    p.life--;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 60));
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
    ctx.restore();
  });
  if (confettiPieces.length) {
    confettiRAF = requestAnimationFrame(stepConfetti);
  } else {
    confettiRAF = null;
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  }
}

/* ===================== 倒计时 ===================== */
const RING_LEN = 2 * Math.PI * 132; // ≈ 829.38
let totalSeconds = 60;
let remainSeconds = 60;
let timerRunning = false;
let timerHandle = null;
let rounds = 0;
let totalElapsed = 0;
let lastTick = 0;
let lastBeepSecond = -1;

function fmt(sec) {
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}

function renderTimer() {
  $("timeText").textContent = fmt(remainSeconds);
  const progress = totalSeconds > 0 ? remainSeconds / totalSeconds : 0;
  const offset = RING_LEN * (1 - progress);
  $("ringFg").setAttribute("stroke-dashoffset", offset.toFixed(2));
  $("ringFg").setAttribute("stroke", remainSeconds <= 10 ? "#ff5c7a" : "url(#ringGrad)");
  $("timerState").textContent =
    timerRunning ? "运行中" : (remainSeconds <= 0 && totalSeconds > 0 ? "已结束" : "待机");
  $("roundCount").textContent = rounds;
  $("totalTime").textContent = fmt(totalElapsed);
  $("startPauseBtn").textContent =
    timerRunning ? "⏸ 暂停"
      : (remainSeconds <= 0 ? "▶ 重新开始"
        : (remainSeconds < totalSeconds ? "▶ 继续" : "▶ 开始"));
  $("timerStage").classList.toggle("finished", remainSeconds <= 0 && totalSeconds > 0);
}

function startTimer() {
  if (timerRunning) return;
  if (totalSeconds <= 0) { toast("请先设定一个大于 0 的时长"); return; }
  if (remainSeconds <= 0) remainSeconds = totalSeconds;
  timerRunning = true;
  lastTick = performance.now();
  timerHandle = setInterval(() => {
    const now = performance.now();
    const dt = now - lastTick;
    lastTick = now;
    totalElapsed += dt / 1000;
    remainSeconds = Math.max(0, remainSeconds - dt / 1000);
    if (remainSeconds <= 0) {
      remainSeconds = 0;
      stopTimer(true);
      return;
    }
    const whole = Math.ceil(remainSeconds);
    if (whole <= 5 && whole !== lastBeepSecond) {
      lastBeepSecond = whole;
      beep(whole === 1 ? 1200 : 700, 0.08, "square", 0.14);
    }
    renderTimer();
  }, 100);
  renderTimer();
}

function stopTimer(finished) {
  timerRunning = false;
  clearInterval(timerHandle);
  timerHandle = null;
  if (finished) {
    rounds++;
    beep(660, 0.25, "sine", 0.22);
    setTimeout(() => beep(880, 0.25, "sine", 0.22), 260);
    setTimeout(() => beep(1180, 0.4, "sine", 0.22), 520);
    if ($("confettiOn").checked) burstConfetti();
    toast("⏰ 时间到！");
  }
  renderTimer();
}

function setTotal(sec) {
  sec = Math.max(0, Math.round(sec));
  totalSeconds = sec;
  remainSeconds = sec;
  timerRunning = false;
  clearInterval(timerHandle);
  timerHandle = null;
  lastBeepSecond = -1;
  $("minInput").value = Math.floor(sec / 60);
  $("secInput").value = sec % 60;
  renderTimer();
}

/* 倒计时按钮绑定 */
$("startPauseBtn").addEventListener("click", () => {
  if (timerRunning) stopTimer(false); else startTimer();
});
$("resetTimerBtn").addEventListener("click", () => {
  stopTimer(false);
  remainSeconds = totalSeconds;
  lastBeepSecond = -1;
  renderTimer();
});
Array.prototype.forEach.call(document.querySelectorAll(".presets [data-sec]"), (b) => {
  b.addEventListener("click", () => {
    setTotal(Number(b.dataset.sec));
    toast("已设定 " + fmt(totalSeconds));
  });
});
$("applyBtn").addEventListener("click", () => {
  const m = Math.max(0, Math.min(180, parseInt($("minInput").value, 10) || 0));
  const s = Math.max(0, Math.min(59, parseInt($("secInput").value, 10) || 0));
  setTotal(m * 60 + s);
  toast("已设定 " + fmt(totalSeconds));
});
["minInput", "secInput"].forEach((id) => {
  $(id).addEventListener("keydown", (e) => { if (e.key === "Enter") $("applyBtn").click(); });
});
$("soundToggle2").addEventListener("click", () => {
  const c = $("soundOn");
  c.checked = !c.checked;
  $("soundToggle2").textContent = "🔔 铃声：" + (c.checked ? "开" : "关");
  toast("提示音已" + (c.checked ? "开启" : "关闭"));
});
$("soundOn").addEventListener("change", () => {
  $("soundToggle2").textContent = "🔔 铃声：" + ($("soundOn").checked ? "开" : "关");
});

/* ===================== 名单区域绑定 ===================== */
$("drawBtn").addEventListener("click", draw);
$("nameInput").addEventListener("input", () => {
  syncNames(true);
  renderHistory();
});
$("noRepeat").addEventListener("change", () => {
  updateDrawButton();
  renderPoolInfo();
});

$("sampleBtn").addEventListener("click", () => {
  const sample = ["陈嘉豪", "林思远", "黄雨桐", "张一鸣", "李梓萱", "王浩然",
                  "赵欣怡", "刘子墨", "周诗涵", "吴天佑", "郑可欣", "孙明轩"];
  $("nameInput").value = sample.join("\n");
  drawnNames = [];
  syncNames(false);
  renderHistory();
  toast("已载入示例名单");
});

$("clearBtn").addEventListener("click", () => {
  $("nameInput").value = "";
  drawnNames = [];
  syncNames(false);
  renderHistory();
  const el = $("displayName");
  el.textContent = "准备就绪";
  el.classList.add("idle");
  toast("名单已清空");
});

$("resetPoolBtn").addEventListener("click", () => {
  drawnNames = [];
  renderHistory();
  renderPoolInfo();
  updateDrawButton();
  toast("抽取进度已重置");
});

/* ===================== 键盘快捷键 ===================== */
document.addEventListener("keydown", (e) => {
  const tag = (e.target.tagName || "").toLowerCase();
  const typing = tag === "textarea" || tag === "input";
  if (e.code === "Space" && !typing) {
    e.preventDefault();
    draw();
  } else if (e.key === "Enter" && !typing) {
    e.preventDefault();
    if (timerRunning) stopTimer(false); else startTimer();
  } else if (e.key === "Escape") {
    $("overlay").classList.remove("show");
  }
});

/* ===================== 初始化 ===================== */
(function init() {
  let saved = "";
  try { saved = localStorage.getItem(LS_NAMES) || ""; } catch (e) {}
  if (saved.trim()) {
    $("nameInput").value = saved;
  } else {
    $("nameInput").value = ["陈嘉豪", "林思远", "黄雨桐", "张一鸣", "李梓萱",
                            "王浩然", "赵欣怡", "刘子墨", "周诗涵", "吴天佑"].join("\n");
  }
  syncNames(false);
  renderHistory();
  setTotal(60);
  renderTimer();
})();
</script>
